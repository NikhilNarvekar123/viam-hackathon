# Opt-in --continuous only. Does not enable any audio/side-camera producer.
# CPU image thresholds are conservative starting points, NOT physical validation.
idle_poll_s: 2.0
leftover_retries: 3  # fresh looks in a row that pick nothing before idling with parts left behind
settle_s: 0.3
sample_interval_s: 0.2
capture_timeout_s: 10.0
max_frame_age_s: 5.0
home_joint_tolerance_deg: 0.5
# Measured 14 Nov on the station, home view, nothing moving: 600-1135 px changed by >= 15 between frames,
# 20-272 by >= 25, 3-19 by >= 35, 0-4 by >= 50. At the old 15 / 24 px every check said 'not stable'.
# A washer is about 200 px, so a new part still counts as a change.
validation:
  reference_size_px: [640, 480]
  difference_threshold: 45.0
  max_illumination_shift: 12.0
  min_change_area_px: 40
  max_changed_pixels: 150
  stability_threshold: 40.0
  stability_max_changed_pixels: 150
  expected_margin_px: 4
  table_ring_px: 8
  max_remaining_foreground_px: 4
  min_removal_fraction: 0.25
  max_table_deviation: 25.0

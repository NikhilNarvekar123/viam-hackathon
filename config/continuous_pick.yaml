# Opt-in --continuous only. Does not enable any audio/side-camera producer.
# CPU image thresholds are conservative starting points, NOT physical validation.
idle_poll_s: 2.0
settle_s: 0.3
sample_interval_s: 0.2
capture_timeout_s: 10.0
max_frame_age_s: 5.0
home_joint_tolerance_deg: 0.5
validation:
  reference_size_px: [640, 480]
  difference_threshold: 25.0
  max_illumination_shift: 12.0
  min_change_area_px: 8
  max_changed_pixels: 32
  stability_threshold: 15.0
  stability_max_changed_pixels: 24
  expected_margin_px: 4
  table_ring_px: 8
  max_remaining_foreground_px: 4
  min_removal_fraction: 0.25
  max_table_deviation: 25.0

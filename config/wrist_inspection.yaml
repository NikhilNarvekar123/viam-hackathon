# Camera-only inspection; no robot movement.
camera_name: cam
# List of [left, top, right, bottom] full-frame pixel boxes; one object per box.
rois: []
# Used automatically when no manual ROI or whole-frame override is supplied.
auto_crop:
  # Pixel/area thresholds below use this canonical resolution (not stream size).
  reference_size_px: [640, 480]
  # Requested proportional square padding; training framing not available locally.
  crop_padding_factor: 1.45
  min_crop_side_px: 36
  # Disabled: raw-tensor ablation found no score-separation benefit.
  crop_sharpening:
    enabled: false
    sigma: 1.2
    amount: 0.35
    # Ignore luminance detail below two 8-bit intensity levels to limit noise boost.
    noise_floor: 2.0
  neighbor_mask_margin_px: 4
  neighbor_feather_px: 0
  dedup_center_distance_px: 3
  dedup_iou_threshold: 0.8
  # Exclude poorly framed parts and border clutter. Keep parts inside this margin.
  frame_edge_margin_px: 15
  # Foreground Laplacian variance at reference resolution; reject smooth shadows.
  min_laplacian_variance: 40  # was 50: a real 25 mm screw scored 48.6; kept parts score 160+
  # Suppress small aligned fragments mostly overlapping a larger object's box.
  fragment_min_bbox_coverage: 0.75
  fragment_max_area_ratio: 0.25
  fragment_max_angle_difference_deg: 15
  workspace_roi: null
  background_blur_radius_px: 20
  difference_threshold: 20
  min_area_px: 80
  max_area_px: 12000
  opening_radius_px: 0
  closing_radius_px: 1
  crop_padding_px: 8
  orientation_min_ratio: 2.0
  max_foreground_fraction: 0.4
model:
  path: models/anomalib_v3_20261114T150012Z/model.xml
  device: CPU
  cache_dir: models/openvino_cache
  image_size: 128
  score_output: pred_score
  heatmap_output: anomaly_map
  # Graph verified: float32 NCHW, external RGB /255; embedded resize 256x256
  # and ImageNet normalization. Training color/framing provenance still needed.
  normalization_in_model: true
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  # User-selected Stage 1 operating threshold; not validated calibration.
  # Scores below threshold route directly to GOOD; >= threshold escalates to VLM.
  # Scores are not probabilities.
  threshold: 0.65

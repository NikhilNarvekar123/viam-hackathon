# Camera-only inspection; no robot movement.
camera_name: cam
# List of [left, top, right, bottom] full-frame pixel boxes; one object per box.
rois: []
# Used automatically when no manual ROI or whole-frame override is supplied.
auto_crop:
  workspace_roi: null
  background_blur_radius_px: 20
  difference_threshold: 20
  min_area_px: 80
  max_area_px: 12000
  opening_radius_px: 0
  closing_radius_px: 1
  crop_padding_px: 8
  orientation_min_ratio: 2.0
  max_foreground_fraction: 0.4
model:
  path: models/anomalib_v2_20261113T203526Z/model.xml
  device: CPU
  cache_dir: models/openvino_cache
  image_size: 128
  score_output: pred_score
  heatmap_output: anomaly_map
  # Provisional: RGB / 255, no external normalization. Confirm with trainer.
  normalization_in_model: true
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  # User-selected initial threshold; validate on labeled wrist-camera crops.
  # Scores are not probabilities. score >= threshold is anomalous.
  threshold: 0.4
